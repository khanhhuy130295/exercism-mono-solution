name: Go Tests

on:
    push:
        branches: [main, master, develop]
        paths:
            - "go/**"
            - ".github/workflows/go-tests.yml"
    pull_request:
        branches: [main, master, develop]
        paths:
            - "go/**"
            - ".github/workflows/go-tests.yml"

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                go-version: ["1.21", "1.22", "1.27.1"]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: ${{ matrix.go-version }}

            - name: Find and run tests in all exercise directories
              run: |
                  for dir in go/*/; do
                    if [ -f "$dir/go.mod" ]; then
                      echo "Testing $dir"
                      (cd "$dir" && go test -v)
                    fi
                  done
